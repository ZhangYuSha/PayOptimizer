<div class="auth-page">

  <div class="auth-card">

    <h1>
      Welcome Back
    </h1>

    <p>
      Sign in to continue using PayOptimizer.
    </p>


    <form
      (ngSubmit)="login()"
    >

      <div class="form-group">

        <label>
          Email
        </label>

        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
        >

      </div>


      <div class="form-group">

        <label>
          Password
        </label>

        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
        >

      </div>


      <div
        class="error"
        *ngIf="errorMessage"
      >

        {{ errorMessage }}

      </div>


      <button
        type="submit"
        class="submit-button"
        [disabled]="loading"
      >

        {{ loading
          ? 'Signing In...'
          : 'Sign In'
        }}

      </button>

    </form>


    <p class="bottom-text">

      Don't have an account?

      <a routerLink="/register">
        Create Account
      </a>

    </p>

  </div>

</div>
