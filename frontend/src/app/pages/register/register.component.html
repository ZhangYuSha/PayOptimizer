<div class="auth-page">

  <div class="auth-card">

    <h1>
      Create Account
    </h1>

    <p>
      Create an account to use PayOptimizer.
    </p>


    <form
      (ngSubmit)="register()"
    >

      <div class="form-group">

        <label>
          Name
        </label>

        <input
          type="text"
          name="name"
          [(ngModel)]="name"
          placeholder="Enter your name"
        >

      </div>


      <div class="form-group">

        <label>
          Email
        </label>

        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
        >

      </div>


      <div class="form-group">

        <label>
          Password
        </label>

        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Create a password"
        >

      </div>


      <div
        class="error"
        *ngIf="errorMessage"
      >

        {{ errorMessage }}

      </div>


      <div
        class="success"
        *ngIf="successMessage"
      >

        {{ successMessage }}

      </div>


      <button
        type="submit"
        class="submit-button"
        [disabled]="loading"
      >

        {{ loading
          ? 'Creating Account...'
          : 'Create Account'
        }}

      </button>

    </form>


    <p class="bottom-text">

      Already have an account?

      <a routerLink="/login">
        Sign In
      </a>

    </p>

  </div>

</div>
